<!doctype html>
<html lang="ru" data-demo-app="booking">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Букинг-CRM</title>
<meta name="theme-color" content="#141414">
<meta name="description" content="Букинг-CRM РОБОРАБ: брони со всех площадок, единый календарь и публикация объявлений.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Букинг-CRM">
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="./roborab-ui.css">
<link rel="stylesheet" href="../home-icon.css">
<style>
/* Общая раскладка демо РОБОРАБ поверх roborab-ui.css. Монохром: чёрная основа, фиолетовый #0A84FF акцентом.
   Раскладка: фиксированная шапка, нижний тачбар до 900 px, боковое меню от 900 px,
   справа выезжает панель карточки. Светлая тема, как во всех приложениях РОБОРАБ. */
:root {
  --bg: #f4f4f2;
  --surface: #ffffff;
  --text: #141414;
  --text-2: color-mix(in srgb, #141414 66%, #ffffff);
  --text-3: color-mix(in srgb, #141414 56%, #ffffff);
  --border: rgb(20 20 20 / 0.12);
  --border-strong: rgb(20 20 20 / 0.22);
  --soft: color-mix(in srgb, #141414 9%, #ffffff);
  --soft-2: color-mix(in srgb, #141414 16%, #ffffff);
  --pressed: color-mix(in srgb, #141414 82%, #000000);
  --on-violet: var(--on-banner);
  --warn: #c98617;
  --warn-soft: color-mix(in srgb, #e0a33c 16%, #ffffff);
  --danger: #d2483a;
  --danger-soft: color-mix(in srgb, #df5c4e 14%, #ffffff);
  --ok: #23845a;
  --ok-soft: color-mix(in srgb, #2f9e6e 14%, #ffffff);
  --shadow-raised: 0 12px 32px -16px rgb(0 0 0 / 0.28);
  --panel-w: 560px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.45 var(--rr-font);
  -webkit-font-smoothing: antialiased;
}
/* Под статус-баром отдельной подложки нет: шапка закрывает его сама, при прокрутке проявляется стекло .rr-scroll-status. Как в Beauty Box. */
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--rr-violet); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.tertiary { color: var(--text-3); }
.nowrap { white-space: nowrap; }

/* Шапка и навигация */
.app-header { position: fixed; inset: 0 0 auto; z-index: 41; }
.app-header .rr-header-row { grid-template-columns: minmax(0, 1fr) auto auto; }
.app-header .rr-header-action { position: relative; }
.badge {
  position: absolute;
  top: 6px;
  right: 4px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--rr-lime);
  color: #fff;
  font: 800 11px/18px var(--rr-display);
  text-align: center;
}
@media (max-width: 899px) { .rr-rail { display: none; } }
.rail-foot {
  margin-top: auto;
  padding: 12px 16px 4px;
  color: var(--text-3);
  font: italic 900 15px/1 var(--rr-display);
  letter-spacing: -.02em;
}

main {
  padding-top: calc(var(--rr-header-height) + 24px);
  padding-bottom: calc(var(--rr-dock-space) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 900px) {
  main {
    margin-left: var(--rr-rail-width);
    padding-top: calc(var(--rr-header-height) + 32px);
    padding-bottom: 48px;
    padding-left: max(32px, env(safe-area-inset-left, 0px));
    padding-right: max(32px, env(safe-area-inset-right, 0px));
  }
}
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
.page > * { min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title {
  margin: 0;
  font: italic 900 30px/1.02 var(--rr-display);
  letter-spacing: -.035em;
  text-wrap: balance;
}
.page-sub { margin: 6px 0 0; color: var(--text-2); }
.section { display: grid; gap: 12px; }
.section-title {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--text-3);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.section-title .link-btn { text-transform: none; letter-spacing: 0; }
.grid-2 { display: grid; gap: 28px; }
@media (min-width: 1100px) { .grid-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }

/* Показатели наследуют цвет текста своей плитки. */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile {
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  min-height: 116px;
  padding: 16px;
  border: 0;
  border-radius: 28px;
  background: var(--rr-violet);
  color: var(--on-banner);
  text-align: left;
  transition: transform .3s var(--rr-ease), background .3s var(--rr-ease);
}
.tile-title { font: 700 14px/1.25 var(--rr-font); }
.tile-count {
  font: italic 900 clamp(34px, 30cqi, 56px)/1 var(--rr-display);
  letter-spacing: -.04em;
  color: inherit;
  font-variant-numeric: tabular-nums;
}
.tile-note { font-size: 13px; color: var(--on-violet); }
.tile--ink { background: var(--sky); }
.tile--light { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.tile--light .tile-count { color: var(--rr-violet); }
.tile--light .tile-note { color: var(--text-2); }
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .tile:hover { transform: translateY(-3px) rotate(-1deg); }
}

/* Карточки и списки */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 16px;
}
.card--tap { cursor: pointer; transition: box-shadow .2s var(--rr-ease), transform .2s var(--rr-ease); }
@media (hover: hover) { .card--tap:hover { box-shadow: var(--shadow-raised); transform: translateY(-1px); } }
.card-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.card-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.between { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.stack { display: grid; gap: 4px; min-width: 0; }
.stack-8 { display: grid; gap: 8px; min-width: 0; }
.stack-12 { display: grid; gap: 12px; min-width: 0; }
.name { font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--text-2); }
.sum { font: italic 900 20px/1.1 var(--rr-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.divider { height: 1px; background: var(--border); border: 0; margin: 4px 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--text-3); }

/* Денежная карточка */
.money { background: var(--rr-violet); border-color: transparent; color: var(--on-banner); }
.money .meta, .money .muted { color: var(--on-violet); }
.money-value {
  font: italic 900 clamp(34px, 8vw, 52px)/1.04 var(--rr-display);
  letter-spacing: -.04em;
  color: inherit;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.money-rows { display: grid; gap: 8px; margin: 16px 0 0; }
.money-row { display: flex; justify-content: space-between; gap: 12px; }
.money-row dt { color: var(--on-violet); }
.money-row dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.money hr { border: 0; height: 1px; background: rgb(255 255 255 / .22); margin: 16px 0; }

/* Полосы прогресса */
.bar { height: 8px; border-radius: 999px; background: var(--soft-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--rr-violet); }
.money .bar { background: rgb(255 255 255 / .18); }
.money .bar > span { background: var(--rr-lime); }
.bar--warn > span { background: var(--warn); }
.bar--danger > span { background: var(--danger); }
.stackbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; }
.stackbar > span { display: block; height: 100%; }

/* Кнопки, чипы, метки */
.btn-sec {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--rr-violet);
  font: normal 800 15px/1 var(--rr-display);
  text-decoration: none;
  transition: border-color .2s var(--rr-ease), background .2s var(--rr-ease);
}
@media (hover: hover) { .btn-sec:hover { border-color: var(--rr-violet); background: var(--soft); } }
.btn-sec:disabled { opacity: .5; cursor: default; }
.btn-sec svg, .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.btn-sec--danger { color: var(--danger); }
.btn-wide { width: 100%; }
.link-btn { border: 0; background: none; padding: 0; color: var(--rr-violet); font-weight: 700; font-size: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips--wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  flex: none;
  min-height: 40px;
  padding: 0 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  transition: border-color .2s var(--rr-ease), background .2s var(--rr-ease), color .2s var(--rr-ease);
}
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--rr-violet); color: var(--rr-violet); }
@media (hover: hover) { .chip:hover { border-color: var(--rr-violet); } }
.chip .count { margin-left: 6px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--rr-violet);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.tag--ok { background: var(--ok-soft); color: var(--ok); }
.tag--warn { background: var(--warn-soft); color: var(--warn); }
.tag--danger { background: var(--danger-soft); color: var(--danger); }
.tag--ink { background: var(--rr-ink); color: #fff; }
.tag--lime { background: var(--rr-lime); color: #fff; }
.dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--text-3); }
.t-warn { color: var(--warn); font-weight: 700; }
.t-danger { color: var(--danger); font-weight: 700; }
.t-ok { color: var(--ok); font-weight: 700; }

/* Аватарка: лаймовый круг, фиолетовые инициалы */
.avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--rr-lime);
  color: #fff;
  font: 800 14px/1 var(--rr-display);
}
.avatar--lg { width: 56px; height: 56px; font-size: 18px; }

/* Поиск и поля */
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
}
.search:focus-within { border-color: var(--rr-violet); }
.search svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--text-3); stroke-width: 1.75; stroke-linecap: round; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--text-2); }
.field input, .field textarea, .field select {
  width: 100%;
  min-height: 48px;
  padding: 12px 16px;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  background: var(--surface);
  font-size: 16px;
  outline: 0;
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--rr-violet); }
.form-row { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* Панель справа (на телефоне во весь экран) */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgb(20 20 20 / .34);
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s var(--rr-ease);
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  z-index: 51;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  transform: translateX(104%);
  transition: transform .45s var(--rr-ease);
  visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet .rr-header { flex: none; }
.sheet .rr-header-row { grid-template-columns: auto minmax(0, 1fr) auto; }
.sheet-body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-top: 24px;
  padding-bottom: calc(32px + var(--rr-safe-bottom));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-body > .stack-16 { display: grid; gap: 20px; }
.sheet-title { margin: 0; font: italic 900 26px/1.05 var(--rr-display); letter-spacing: -.035em; text-wrap: balance; }
@media (min-width: 900px) {
  .sheet {
    inset: 12px 12px 12px auto;
    width: min(var(--panel-w), calc(100% - 24px));
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgb(20 20 20 / .45);
  }
  .sheet .rr-header { border-radius: 0 0 28px 28px; }
  .sheet-body { padding-left: 24px; padding-right: 24px; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } }

.kv { display: grid; gap: 10px; margin: 0; }
.kv > div { display: flex; justify-content: space-between; gap: 16px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; font-weight: 700; text-align: right; overflow-wrap: anywhere; }

/* Тост */
.toast {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: calc(var(--rr-dock-space) + 12px);
  width: max-content;
  max-width: min(440px, calc(100% - 32px));
  padding: 14px 18px;
  border-radius: 22px;
  background: var(--rr-ink);
  color: #fff;
  font-weight: 600;
  box-shadow: var(--shadow-raised);
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s var(--rr-ease), transform .3s var(--rr-ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { .toast { bottom: 24px; left: calc(50% + var(--rr-rail-width) / 2); } }

/* Шаги работы агента */
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; align-items: center; gap: 10px; color: var(--text-3); transition: color .3s; }
.steps li.done { color: var(--text); }
.steps li.run { color: var(--rr-violet); font-weight: 700; }
.step-mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
}
.steps li.done .step-mark { background: var(--rr-violet); border-color: var(--rr-violet); color: #fff; }
.step-mark svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.steps li.run .step-mark { border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .steps li.run .step-mark { animation: none; } }

/* Чат агента внутри приложения */
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 86%; padding: 12px 16px; }
.msg-wrap { display: flex; }
.msg-wrap.user { justify-content: flex-end; }
.chat-compose { flex: none; padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + var(--rr-safe-bottom)); }
@media (min-width: 900px) { .chat-compose { padding: 12px 24px 20px; } }
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chat-bg { background: radial-gradient(120% 70% at 100% 0%, var(--soft-2), transparent 60%), var(--bg); }

.demo-note {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px 16px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  color: var(--text-2);
  font-size: 13px;
}
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.thumb { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; background: var(--soft); }
.thumb svg, .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .4s var(--rr-ease) both; }
@media (prefers-reduced-motion: reduce) { .rise { animation: none; } }

/* Букинг-CRM: календарь, шахматка, фото */
.cal-title { font: italic 900 20px/1 var(--rr-display); letter-spacing: -.03em; }
.cal-nav { color: var(--rr-violet); }
.cal-nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) { .cal-nav:hover { background: var(--soft); color: var(--rr-violet); } }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { margin-bottom: 6px; }
.cal-wd span { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.cal-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  min-width: 0;
  aspect-ratio: 1 / 1.05;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  text-align: left;
  overflow: hidden;
}
.cal-out { border: 0; background: transparent; }
.cal-num { font: 700 14px/1 var(--rr-font); font-variant-numeric: tabular-nums; }
.cal-guest { max-width: 100%; font-size: 11px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) { .cal-guest { display: none; } }
.cal-busy { background: var(--c); border-color: transparent; color: var(--ink); }
.cal-busy:not(.cal-start) { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
.cal-busy:not(.cal-end) { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
.cal-new {
  border: 2px dashed var(--c);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 16%, #ffffff) 0 6px, #ffffff 6px 12px);
  color: var(--text);
}
.cal-blocked { background: repeating-linear-gradient(135deg, var(--soft-2) 0 4px, var(--surface) 4px 9px); color: var(--text-2); }
.cal-today { outline: 2px solid var(--rr-ink); outline-offset: 1px; }
.cal-past:not(.cal-busy) { opacity: .5; }
.cal-past.cal-busy { opacity: .62; }
@media (hover: hover) { .cal-cell:not(.cal-out):not(.cal-busy):hover { border-color: var(--rr-violet); } .cal-busy:hover { filter: brightness(1.08); } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 14px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; }
.legend .lg-new { border: 2px dashed var(--rr-violet); }
.legend .lg-block { background: repeating-linear-gradient(135deg, var(--soft-2) 0 3px, #fff 3px 6px); border: 1px solid var(--border); }

.chess-wrap { overflow-x: auto; padding: 12px; }
.chess { display: grid; gap: 6px; min-width: 640px; }
.chess-head, .chess-row { display: grid; grid-template-columns: 170px repeat(var(--n), minmax(0, 1fr)); gap: 3px; align-items: center; }
.chess-head span { display: grid; justify-items: center; font-size: 11px; color: var(--text-3); text-transform: uppercase; }
.chess-head b { font-size: 14px; color: var(--text); text-transform: none; }
.chess-head .we b { color: var(--rr-violet); }
.chess-name { border: 0; background: none; padding: 0 8px 0 0; text-align: left; font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chess-cell { display: block; height: 30px; padding: 0; border: 0; border-radius: 8px; background: var(--c); }
.chess-cell.is-free { background: var(--soft); }
.chess-cell.is-blocked { background: repeating-linear-gradient(135deg, var(--soft-2) 0 3px, #fff 3px 6px); }
.chess-cell.cal-new { border: 2px dashed var(--c); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 16%, #fff) 0 4px, #fff 4px 8px); }

.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 16px; }
.photo-main { position: absolute; left: 6px; bottom: 6px; }
.photo-add { display: grid; place-content: center; justify-items: center; gap: 6px; aspect-ratio: 1; border: 1.5px dashed var(--rr-violet); border-radius: 16px; background: var(--soft); color: var(--rr-violet); font-size: 12px; font-weight: 700; }
.plat-logo { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; font: italic 900 20px/1 var(--rr-display); flex: none; }
.plat-logo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; }
.flow { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: f; }
@media (min-width: 760px) { .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.flow li { display: grid; gap: 4px; counter-increment: f; padding-top: 52px; }
.flow li::before { content: counter(f); position: absolute; top: 16px; left: 16px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--rr-lime); color: #fff; font: 800 14px/1 var(--rr-display); }

/* Официальный логотип площадки, если его файл лежит в img/platforms */
.plat-logo img { display: none; }
.plat-logo.has-img { background: #fff !important; border: 1px solid var(--border); font-size: 0; }
.plat-logo.has-img img { display: block; width: 100%; height: 100%; padding: 6px; object-fit: contain; }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const RUB = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const rub = (n) => `${RUB.format(Math.round(n))} ₽`;
const mln = (n) => n >= 1e6 ? `${(n / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: 1 })} млн ₽` : rub(n);
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };

const DAY = 86400000;
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const diffDays = (a, b) => Math.round((a - b) / DAY);
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTHS_PREP = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const fd = (d) => `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
const fdShort = (d) => `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}`;
const range = (a, b) => a.getMonth() === b.getMonth()
  ? `${a.getDate()}–${b.getDate()} ${MONTHS_GEN[a.getMonth()]}`
  : `${fd(a)} – ${fd(b)}`;
const relDay = (d) => { const day = new Date(d); day.setHours(0, 0, 0, 0); const k = diffDays(day, TODAY); return k === 0 ? 'сегодня' : k === 1 ? 'завтра' : k === -1 ? 'вчера' : fd(d); };
const hhmm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const initials = (name) => { const p = name.replace(/[.]/g, ' ').trim().split(/\s+/); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* Тост */
let toastTimer;
function toast(text) {
  const el = $('#toast');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* Панель справа. Одна на приложение, содержимое меняется. */
const Sheet = {
  stack: [],
  open(render, opts = {}) {
    this.stack.push({ render, opts });
    this.paint();
    $('#sheet').classList.add('open');
    $('#scrim').classList.add('open');
    document.documentElement.style.overflow = 'hidden';
  },
  replace(render, opts = {}) { this.stack[this.stack.length - 1] = { render, opts }; this.paint(); },
  refresh() { if (this.stack.length) this.paint(true); },
  back() {
    this.stack.pop();
    if (this.stack.length) this.paint(); else this.close();
  },
  close() {
    this.stack = [];
    $('#sheet').classList.remove('open');
    $('#scrim').classList.remove('open');
    document.documentElement.style.overflow = '';
    if (typeof onSheetClosed === 'function') onSheetClosed();
  },
  paint(keepScroll) {
    const top = this.stack[this.stack.length - 1];
    const body = $('#sheet-body');
    const y = body.scrollTop;
    $('#sheet').classList.toggle('chat-bg', !!top.opts.chat);
    $('#sheet-back').innerHTML = this.stack.length > 1 ? I('back') : I('close');
    $('#sheet-back').setAttribute('aria-label', this.stack.length > 1 ? 'Назад' : 'Закрыть');
    body.innerHTML = '';
    const footer = $('#sheet-footer');
    footer.innerHTML = '';
    footer.hidden = true;
    top.render(body, footer);
    if (footer.innerHTML) footer.hidden = false;
    body.scrollTop = keepScroll ? y : 0;
  },
};

/* Маршруты по хешу: #home, #calendar и так далее */
function setupRouter(views, start) {
  const go = (keep) => {
    const name = (location.hash || '').slice(1);
    const view = views[name] ? name : start;
    for (const a of $$('[data-view]')) {
      if (a.dataset.view === view) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    const main = $('#main');
    main.innerHTML = '';
    const page = document.createElement('div');
    page.className = 'page';
    main.appendChild(page);
    const y = window.scrollY;
    views[view](page);
    if (keep && App.view === view) window.scrollTo(0, y);
    else { window.scrollTo(0, 0); document.dispatchEvent(new Event('rr:header-reset')); }
    App.view = view;
  };
  window.addEventListener('hashchange', () => go(false));

}

function openAgentChat(cfg) {
  const log = cfg.log;
  Sheet.open((body, footer) => {
    body.innerHTML = `<div class="chat" id="chat-list" aria-live="polite"></div>`;
    const list = $('#chat-list', body);
    const draw = () => {
      list.innerHTML = log.map((m) => `<div class="msg-wrap ${m.me ? 'user' : ''}"><div class="rr-message msg ${m.me ? 'rr-message--user' : ''}">${m.html || esc(m.text)}</div></div>`).join('');
      body.scrollTop = body.scrollHeight;
    };
    draw();
    footer.className = 'chat-compose';
    footer.innerHTML = `
      <div class="quick">${cfg.quick.map((q) => `<button class="chip" type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <form class="rr-composer" id="chat-form">
        <textarea id="chat-input" rows="1" placeholder="Напишите агенту" aria-label="Сообщение агенту"></textarea>
        <button class="rr-composer-control rr-composer-send" type="submit" aria-label="Отправить" disabled>${I('send')}</button>
      </form>`;
    const input = $('#chat-input', footer);
    const sendBtn = $('.rr-composer-send', footer);
    const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 148) + 'px'; sendBtn.disabled = !input.value.trim(); };
    input.addEventListener('input', grow);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#chat-form', footer).requestSubmit(); } });
    const ask = async (text) => {
      if (!text.trim()) return;
      log.push({ me: true, text });
      draw();
      log.push({ html: '<span class="tertiary">Агент печатает…</span>' });
      draw();
      await sleep(700);
      log.pop();
      log.push({ html: cfg.answer(text) });
      draw();
    };
    $('#chat-form', footer).addEventListener('submit', (e) => { e.preventDefault(); const t = input.value; input.value = ''; grow(); ask(t); });
    footer.addEventListener('click', (e) => { const q = e.target.closest('[data-q]'); if (q) ask(q.dataset.q); });
  }, { chat: true });
}

function monthStats(month) {
  const y = month.getFullYear(), m = month.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  let nights = 0, revenue = 0;
  const bySrc = {};
  for (const b of BOOKINGS) {
    if (!active(b) || b.status === 'new') continue;
    const p = obj(b.obj).price;
    for (let d = new Date(b.from); d < b.to; d = addDays(d, 1)) {
      if (d.getFullYear() === y && d.getMonth() === m) { nights++; revenue += p; bySrc[b.src] = (bySrc[b.src] || 0) + p; }
    }
  }
  return { nights, revenue, occ: nights / (days * OBJECTS.length), bySrc, avg: nights ? revenue / nights : 0 };
}

            <dl class="money-rows">${Object.keys(PLATFORMS).filter((k) => st.bySrc[k]).sort((a, b) => st.bySrc[b] - st.bySrc[a]).map((k) => `

}

function bindGo(root) {
  root.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]');
    if (!g) return;
    const [v, chip] = g.dataset.go.split(':');
    if (chip) bookingsFilter.chip = chip;
    navTo(v);
  });
}

function viewCalendar(page) {
  const o = obj(cal.obj);
  const y = cal.month.getFullYear(), m = cal.month.getMonth();
  const first = new Date(y, m, 1);
  const days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cal-cell cal-out" aria-hidden="true"></div>';
  for (let d = 1; d <= days; d++) {
    const day = new Date(y, m, d);
    const b = BOOKINGS.find((x) => x.obj === o.id && active(x) && x.from <= day && day < x.to);
    const blocked = BLOCKS.has(`${o.id}|${dkey(day)}`);
    const today = sameDay(day, TODAY);
    const past = day < TODAY;
    let style = '', label = '', cls = 'cal-cell';
    if (b) {
      const p = PLATFORMS[b.src];
      cls += b.status === 'new' ? ' cal-new' : ' cal-busy';
      style = `--c:${p.color};--ink:${p.ink}`;
      if (sameDay(b.from, day) || d === 1) label = `<span class="cal-guest">${esc(b.guest.split(' ')[1] || b.guest)}</span>`;
      if (sameDay(b.from, day)) cls += ' cal-start';
      if (sameDay(addDays(b.to, -1), day)) cls += ' cal-end';
    } else if (blocked) cls += ' cal-blocked';
    if (today) cls += ' cal-today';
    if (past) cls += ' cal-past';
    const aria = `${d} ${MONTHS_GEN[m]}: ${b ? `${b.guest}, ${PLATFORMS[b.src].name}${b.status === 'new' ? ', ждёт подтверждения' : ''}` : blocked ? 'закрыто вручную' : 'свободно'}`;
    cells += `<button type="button" class="${cls}" style="${style}" data-day="${dkey(day)}" ${b ? `data-booking="${b.id}"` : ''} aria-label="${esc(aria)}"><span class="cal-num">${d}</span>${label}</button>`;
  }
  const inMonth = BOOKINGS.filter((b) => b.obj === o.id && active(b) && b.from < new Date(y, m + 1, 1) && b.to > first).sort((a, b) => a.from - b.from);
  // шахматка на 14 дней
  const span = 14;
  let chess = `<div class="chess" style="--n:${span}"><div class="chess-head"><span></span>${Array.from({ length: span }, (_, i) => { const d = addDays(TODAY, i); return `<span class="${d.getDay() % 6 === 0 ? 'we' : ''}">${WD[d.getDay()]}<b>${d.getDate()}</b></span>`; }).join('')}</div>`;
  for (const ob of OBJECTS) {
    chess += `<div class="chess-row"><button type="button" class="chess-name" data-obj="${ob.id}">${esc(ob.name)}</button>`;
    for (let i = 0; i < span; i++) {
      const d = addDays(TODAY, i);
      const b = occupying(ob.id, d);
      const bl = BLOCKS.has(`${ob.id}|${dkey(d)}`);
      chess += b ? `<button type="button" class="chess-cell ${b.status === 'new' ? 'cal-new' : ''}" style="--c:${PLATFORMS[b.src].color}" data-booking="${b.id}" aria-label="${esc(`${ob.name}, ${fd(d)}: ${b.guest}`)}"></button>`
        : `<span class="chess-cell ${bl ? 'is-blocked' : 'is-free'}" aria-label="${esc(`${ob.name}, ${fd(d)}: ${bl ? 'закрыто' : 'свободно'}`)}"></span>`;
    }
    chess += '</div>';
  }
  chess += '</div>';

  page.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Календарь</h1><p class="page-sub">Одна сетка для всех площадок. Нажмите на свободный день, чтобы закрыть его везде.</p></div></div>
    <div class="chips" role="group" aria-label="Объект">${OBJECTS.map((x) => `<button class="chip" type="button" aria-pressed="${x.id === o.id}" data-obj="${x.id}">${esc(x.name)}</button>`).join('')}</div>
    <div class="grid-2">
      <section class="card" aria-label="Месяц">
        <div class="between" style="align-items:center;margin-bottom:14px">
          <button class="rr-header-action cal-nav" type="button" data-month="-1" aria-label="Предыдущий месяц">${I('back')}</button>
          <strong class="cal-title">${MONTHS[m]} ${y}</strong>
          <button class="rr-header-action cal-nav" type="button" data-month="1" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="cal-grid cal-wd">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map((w) => `<span>${w}</span>`).join('')}</div>
        <div class="cal-grid" id="cal-grid">${cells}</div>
        <div class="legend">${Object.keys(PLATFORMS).map((k) => `<span><i style="background:${PLATFORMS[k].color}"></i>${PLATFORMS[k].name}</span>`).join('')}<span><i class="lg-new"></i>Ждёт подтверждения</span><span><i class="lg-block"></i>Закрыто вручную</span></div>
      </section>
      <section class="section" aria-labelledby="h-month">
        <h2 class="section-title" id="h-month"><span>Брони в ${MONTHS_PREP[m]}</span><span class="tertiary">${inMonth.length}</span></h2>
        <ul class="card-list">${inMonth.map((b) => bookingCard(b, { actions: true })).join('') || '<li class="card empty">В этом месяце броней нет</li>'}</ul>
      </section>
    </div>
    <section class="section" aria-labelledby="h-chess">
      <h2 class="section-title" id="h-chess">Все объекты, ближайшие 2 недели</h2>
      <div class="card chess-wrap">${chess}</div>
    </section>`;
  page.addEventListener('click', (e) => {
    const ob = e.target.closest('[data-obj]');
    if (ob) { cal.obj = ob.dataset.obj; App.rerender(); return; }
    const mo = e.target.closest('[data-month]');
    if (mo) { cal.month = new Date(y, m + Number(mo.dataset.month), 1); App.rerender(); return; }
    const day = e.target.closest('[data-day]:not([data-booking])');
    if (day) { toggleBlock(o, day.dataset.day); }
  });
  bindBookingClicks(page);
}

function toggleBlock(o, key) {
  const k = `${o.id}|${key}`;
  const [yy, mm, dd] = key.split('-').map(Number);
  const d = new Date(yy, mm - 1, dd);
  if (d < TODAY) { toast('Прошедшие дни закрыть нельзя'); return; }
  if (BLOCKS.has(k)) {
    BLOCKS.delete(k);
    toast(`${fd(d)} снова открыто на ${o.platforms.length} площадках`);
  } else {
    BLOCKS.add(k);
    LOG.unshift({ at: new Date(), text: `${o.name}: ${fd(d)} закрыто вручную на ${o.platforms.map((p) => PLATFORMS[p].name).join(', ')}.` });
    toast(`${fd(d)} закрыто на ${o.platforms.length} площадках`);
  }
  App.rerender();
}

function viewBookings(page) {
  const chips = [['all', 'Все'], ['new', 'Новые'], ['upcoming', 'Предстоящие'], ['checkin', 'Заезд сегодня'], ['checkout', 'Выезд сегодня'], ['stay', 'Проживают'], ['done', 'Завершённые'], ['cancelled', 'Отменённые']];
  const match = (b, c) => {
    const s = status(b);
    if (c === 'all') return true;
    if (c === 'upcoming') return s === 'confirmed';
    return s === c;
  };
  page.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Брони</h1><p class="page-sub">Со всех площадок в одном списке</p></div></div>
    <label class="search">${I('search')}<input id="bk-q" type="search" placeholder="Гость или объект" value="${esc(bookingsFilter.q)}" autocomplete="off"></label>
    <div class="chips" role="group" aria-label="Фильтр">${chips.map(([id, t]) => `<button class="chip" type="button" data-chip="${id}" aria-pressed="${bookingsFilter.chip === id}">${t}<span class="count">${BOOKINGS.filter((b) => match(b, id)).length}</span></button>`).join('')}</div>
    <ul class="card-grid" id="bk-list" style="list-style:none;margin:0;padding:0"></ul>`;
  const draw = () => {
    const q = bookingsFilter.q.trim().toLowerCase();
    const items = BOOKINGS.filter((b) => match(b, bookingsFilter.chip))
      .filter((b) => !q || b.guest.toLowerCase().includes(q) || obj(b.obj).name.toLowerCase().includes(q))
      .sort((a, b) => (bookingsFilter.chip === 'done' ? b.from - a.from : a.from - b.from));
    $('#bk-list', page).innerHTML = items.map((b) => bookingCard(b, { actions: true })).join('') || '<li class="card empty">Ничего не найдено</li>';
  };
  draw();
  $('#bk-q', page).addEventListener('input', (e) => { bookingsFilter.q = e.target.value; draw(); });
  page.addEventListener('click', (e) => {
    const c = e.target.closest('[data-chip]');
    if (c) { bookingsFilter.chip = c.dataset.chip; $$('[data-chip]', page).forEach((x) => x.setAttribute('aria-pressed', x === c)); draw(); }
  });
  bindBookingClicks(page);
}

function openBooking(id) {
  Sheet.open((body) => {
    const b = BOOKINGS.find((x) => x.id === id);
    const o = obj(b.obj);
    const st = status(b);
    const targets = o.platforms.filter((p) => p !== b.src);
    body.innerHTML = `<div class="stack-16">
      <div class="row"><span class="avatar avatar--lg">${initials(b.guest)}</span><div class="stack"><h2 class="sheet-title">${esc(b.guest)}</h2><div class="row" style="gap:8px;flex-wrap:wrap">${ptag(b.src)}${stag(b)}</div></div></div>
      <div class="card"><dl class="kv">
        <div><dt>Объект</dt><dd>${esc(o.name)}</dd></div>
        <div><dt>Заезд</dt><dd class="num">${WD[b.from.getDay()]}, ${fd(b.from)}, с 14:00</dd></div>
        <div><dt>Выезд</dt><dd class="num">${WD[b.to.getDay()]}, ${fd(b.to)}, до 12:00</dd></div>
        <div><dt>Ночей</dt><dd>${b.nights}</dd></div>
        <div><dt>Гостей</dt><dd>${b.guestsN}</dd></div>
        <div><dt>Телефон</dt><dd class="num">${b.phone}</dd></div>
      </dl></div>
      <div class="card money"><div class="meta">К оплате · ${rub(o.price)} за ночь</div><div class="money-value">${rub(b.sum)}</div></div>
      <section class="section"><h3 class="section-title">Синхронизация дат</h3>
        <ul class="card-list">${[b.src, ...targets].map((p) => {
          const isSrc = p === b.src;
          const state = b.status === 'cancelled' ? (isSrc ? ['Бронь отменена', 'tag--danger'] : ['Даты открыты', ''])
            : b.status === 'new' ? (isSrc ? ['Ждёт ответа', 'tag--lime'] : ['Закроются после подтверждения', ''])
            : (isSrc ? ['Источник брони', 'tag--ink'] : ['Даты закрыты', 'tag--ok']);
          return `<li class="card"><div class="between" style="align-items:center"><span class="row" style="gap:10px"><span class="dot" style="background:${PLATFORMS[p].color}"></span><b>${PLATFORMS[p].name}</b></span><span class="tag ${state[1]}">${state[0]}</span></div></li>`;
        }).join('')}</ul>
      </section>
      ${st === 'new' ? `<div class="card-actions" data-actions="${b.id}" style="margin:0"><button class="btn" type="button" data-confirm="${b.id}">${I('check')}Подтвердить</button><button class="btn-sec" type="button" data-reject="${b.id}">Отклонить</button></div>` : ''}
      ${['confirmed', 'checkin'].includes(st) ? `<button class="btn-sec btn-sec--danger" type="button" data-cancel="${b.id}">Отменить бронь</button>` : ''}
      <button class="btn-sec" type="button" data-copy="${b.phone}">${I('phone')}Скопировать телефон</button>
    </div>`;
    body.onclick = async (e) => {
      const c = e.target.closest('[data-confirm]');
      if (c) { await confirmBooking(c.dataset.confirm, c.closest('[data-actions]')); return; }
      const r = e.target.closest('[data-reject]');
      if (r) { rejectBooking(r.dataset.reject); return; }
      const x = e.target.closest('[data-cancel]');
      if (x) {
        x.outerHTML = `<div class="card" style="border-color:var(--danger)"><p style="margin:0 0 12px">Отменить бронь ${esc(b.guest)}? Даты откроются на всех площадках.</p><div class="card-actions" style="margin:0"><button class="btn" type="button" data-cancel-yes>Да, отменить</button><button class="btn-sec" type="button" data-cancel-no>Оставить</button></div></div>`;
        return;
      }
      if (e.target.closest('[data-cancel-yes]')) { b.status = 'cancelled'; LOG.unshift({ at: new Date(), text: `${o.name}: бронь ${b.guest} отменена, ${range(b.from, b.to)} открыты на ${o.platforms.length} площадках.` }); toast(`Бронь отменена. Даты открыты на ${o.platforms.length} площадках`); Sheet.refresh(); App.rerender(); return; }
      if (e.target.closest('[data-cancel-no]')) { Sheet.refresh(); return; }
      const cp = e.target.closest('[data-copy]');
      if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); toast('Телефон скопирован'); } catch { toast(cp.dataset.copy); } }
    };
  });
}

function viewObjects(page) {

    const y = TODAY.getFullYear(), m = TODAY.getMonth(), days = new Date(y, m + 1, 0).getDate();
    let n = 0;
    for (let d = 1; d <= days; d++) if (occupying(o.id, new Date(y, m, d))) n++;
    return Math.round(n / days * 100);
  };
  page.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Объекты</h1><p class="page-sub">Одно объявление публикуется на все подключённые площадки</p></div>

      const occ = st(o);
      const cur = occupying(o.id, TODAY);
      return `<li class="card card--tap" data-object="${o.id}" style="padding:10px">
        <div class="thumb">${o.photo ? `<img src="${o.photo}" alt="${esc(o.name)}" style="object-position:${o.photoPos || '50% 50%'}">` : aptScene(o.scene)}</div>
        <div class="stack-8" style="padding:12px 6px 6px">
          <div class="between"><span class="name">${esc(o.name)}</span><span class="sum">${rub(o.price)}</span></div>
          <span class="meta">${esc(o.addr)} · ${o.area} м² · до ${o.guests} гостей</span>
          <div class="row" style="flex-wrap:wrap;gap:6px">${o.platforms.map(ptag).join('')}</div>
          <div class="between meta" style="margin-top:4px"><span>Загрузка в ${MONTHS_PREP[TODAY.getMonth()]}</span><b class="num" style="color:var(--text)">${occ}%</b></div>
          <div class="bar"><span style="width:${occ}%"></span></div>
          <span class="meta">${cur ? `Сейчас живёт ${esc(cur.guest)} до ${fd(cur.to)}` : 'Сегодня свободно'}</span>
        </div></li>`;
    }).join('')}</ul>`;
  $('#new-listing', page).addEventListener('click', openNewListing);
  page.addEventListener('click', (e) => { const c = e.target.closest('[data-object]'); if (c) openObject(c.dataset.object); });

function openObject(id) {
  Sheet.open((body) => {
    const o = obj(id);
    const next = BOOKINGS.filter((b) => b.obj === id && active(b) && b.to > TODAY).sort((a, b) => a.from - b.from).slice(0, 4);
    body.innerHTML = `<div class="stack-16">
      <div class="thumb" style="aspect-ratio:16/10">${o.photo ? `<img src="${o.photo}" alt="${esc(o.name)}" style="object-position:${o.photoPos || '50% 50%'}">` : aptScene(o.scene, 1)}</div>
      <div><h2 class="sheet-title">${esc(o.name)}</h2><p class="meta" style="margin:6px 0 0">${esc(o.addr)}</p></div>
      <div class="card"><dl class="kv">
        <div><dt>Площадь</dt><dd>${o.area} м²</dd></div><div><dt>Гостей</dt><dd>до ${o.guests}</dd></div>
      </dl></div>
      <section class="section"><h3 class="section-title">Цена за ночь на всех площадках</h3>
        <div class="card stack-12">
          <div class="row"><div class="field grow" style="margin:0"><label for="obj-price">Цена, ₽</label><input id="obj-price" inputmode="numeric" value="${o.price}"></div></div>
          <div id="price-steps"></div>
          <button class="btn" type="button" id="obj-price-save">Обновить на ${o.platforms.length} площадках</button>
        </div>
      </section>
      <section class="section"><h3 class="section-title">Площадки</h3>
        <div class="chips chips--wrap">${CHANNELS.map((p) => `<button class="chip" type="button" data-plat="${p}" aria-pressed="${o.platforms.includes(p)}"><span class="dot" style="background:${PLATFORMS[p].color};margin-right:8px;vertical-align:-1px"></span>${PLATFORMS[p].name}</button>`).join('')}</div>
        <p class="meta" style="margin:0">Отмеченные площадки получают объявление, цену и закрытые даты</p>
      </section>
      <section class="section"><h3 class="section-title">Ближайшие брони</h3>
        <ul class="card-list">${next.map((b) => `<li class="card card--tap" data-booking="${b.id}"><div class="between"><span class="stack"><b>${esc(b.guest)}</b><span class="meta num">${range(b.from, b.to)} · ${b.nights} ${plural(b.nights, 'ночь', 'ночи', 'ночей')}</span></span>${ptag(b.src)}</div></li>`).join('') || '<li class="card empty">Броней пока нет</li>'}</ul>

      Sheet.refresh();

      const p = e.target.closest('[data-plat]');
      if (p) {
        const k = p.dataset.plat;
        if (o.platforms.includes(k)) { if (o.platforms.length === 1) { toast('Нужна хотя бы одна площадка'); return; } o.platforms = o.platforms.filter((x) => x !== k); toast(`Объявление снято с площадки ${PLATFORMS[k].name}`); }
        else { o.platforms.push(k); toast(`Объявление опубликовано на площадке ${PLATFORMS[k].name}`); }
        Sheet.refresh(); App.rerender();
        return;
      }
      const b = e.target.closest('[data-booking]');
      if (b) openBooking(b.dataset.booking);
    };
  });
}

function openNewListing() {
  const draft = { name: 'Студия с видом на парк', addr: 'Сочи, ул. Виноградная, 14', price: 3800, guests: 2, area: 31, desc: 'Светлая студия на 7 этаже, вид на парк Ривьера. Двуспальная кровать, кухня, стиральная машина, Wi-Fi. До моря 10 минут пешком.', photos: [{ url: PHOTOS['living-bright'], pos: '20% 50%' }, { url: PHOTOS['living-wood'], pos: '80% 50%' }, { url: PHOTOS['living-beige'], pos: '15% 60%' }], platforms: [...CHANNELS] };
  Sheet.open((body) => {
    body.innerHTML = `<form class="stack-16" id="nl-form" novalidate>
      <div><h2 class="sheet-title">Новое объявление</h2><p class="meta" style="margin:6px 0 0">Заполните один раз, агент разместит на всех выбранных площадках</p></div>
      <section class="section"><h3 class="section-title">Фото</h3>
        <div class="photo-grid" id="nl-photos"></div>
        <input type="file" id="nl-file" accept="image/*" multiple hidden>
      </section>
      <div class="field"><label for="nl-name">Название</label><input id="nl-name" value="${esc(draft.name)}" required></div>
      <div class="field"><label for="nl-addr">Адрес</label><input id="nl-addr" value="${esc(draft.addr)}" required></div>
      <div class="form-row">
        <div class="field"><label for="nl-price">Цена за ночь, ₽</label><input id="nl-price" inputmode="numeric" value="${draft.price}"></div>
        <div class="field"><label for="nl-guests">Гостей</label><input id="nl-guests" inputmode="numeric" value="${draft.guests}"></div>
      </div>
      <div class="field"><label for="nl-desc">Описание</label><textarea id="nl-desc">${esc(draft.desc)}</textarea></div>
      <section class="section"><h3 class="section-title">Где опубликовать</h3>
        <div class="chips chips--wrap">${CHANNELS.map((p) => `<button class="chip" type="button" data-nlp="${p}" aria-pressed="true"><span class="dot" style="background:${PLATFORMS[p].color};margin-right:8px;vertical-align:-1px"></span>${PLATFORMS[p].name}</button>`).join('')}</div>
      </section>
      <div id="nl-progress"></div>
      <button class="btn" type="submit" id="nl-submit">Опубликовать</button>
    </form>`;
    const drawPhotos = () => {
      $('#nl-photos', body).innerHTML = draft.photos.map((p, i) => `<div class="thumb photo">${p.url ? `<img src="${p.url}" alt="Фото ${i + 1}" style="object-position:${p.pos || '50% 50%'}">` : aptScene(p.scene, p.view || 0)}${i === 0 ? '<span class="tag tag--lime photo-main">Обложка</span>' : ''}</div>`).join('')
        + `<button type="button" class="thumb photo-add" id="nl-add">${I('upload')}<span>Добавить фото</span></button>`;
      $('#nl-add', body).onclick = () => $('#nl-file', body).click();
    };
    drawPhotos();
    $('#nl-file', body).onchange = (e) => {
      for (const f of e.target.files) if (f.type.startsWith('image/')) draft.photos.push({ url: URL.createObjectURL(f) });
      drawPhotos();
    };
    body.onclick = (e) => {
      const p = e.target.closest('[data-nlp]');
      if (!p) return;
      const k = p.dataset.nlp;
      draft.platforms = draft.platforms.includes(k) ? draft.platforms.filter((x) => x !== k) : [...draft.platforms, k];
      p.setAttribute('aria-pressed', draft.platforms.includes(k));
      $('#nl-submit', body).textContent = draft.platforms.length ? `Опубликовать на ${draft.platforms.length} ${plural(draft.platforms.length, 'площадке', 'площадках', 'площадках')}` : 'Выберите площадку';
      $('#nl-submit', body).disabled = !draft.platforms.length;
    };
    $('#nl-submit', body).textContent = `Опубликовать на ${draft.platforms.length} площадках`;
    $('#nl-form', body).onsubmit = async (e) => {
      e.preventDefault();
      const name = $('#nl-name', body).value.trim();
      const addr = $('#nl-addr', body).value.trim();
      const price = parseInt($('#nl-price', body).value.replace(/\D/g, ''), 10);
      if (!name || !addr) { toast('Заполните название и адрес'); return; }
      if (!price || price < 500) { toast('Укажите цену от 500 ₽'); return; }
      $('#nl-submit', body).disabled = true;
      const box = $('#nl-progress', body);
      box.innerHTML = `<div class="card"><ul class="steps">${[`Готовим ${draft.photos.length} фото и описание`, ...draft.platforms.map((p) => `${PLATFORMS[p].name}: публикуем`), 'Связываем календари'].map((t) => `<li><span class="step-mark">${I('check')}</span>${esc(t)}</li>`).join('')}</ul></div>`;
      box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      for (const li of $$('li', box)) { li.classList.add('run'); await sleep(560); li.classList.remove('run'); li.classList.add('done'); }
      const id = 'o' + (OBJECTS.length + 1);
      OBJECTS.push({ id, name, addr, price, guests: parseInt($('#nl-guests', body).value, 10) || 2, area: draft.area, platforms: [...draft.platforms], scene: 4, photo: draft.photos[0]?.url, photoPos: draft.photos[0]?.pos });
      LOG.unshift({ at: new Date(), text: `Новое объявление «${name}» опубликовано на ${draft.platforms.map((p) => PLATFORMS[p].name).join(', ')}.` });
      toast(`Объявление опубликовано на ${draft.platforms.length} площадках`);
      Sheet.close();
      navTo('objects');
    };
  });
}

const SYNC = { avito: 2, sutochno: 1, ostrovok: 3, yandex: 2 };
function viewPlatforms(page) {
  page.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Площадки</h1><p class="page-sub">Брони приходят отсюда, даты и цены уходят туда же</p></div></div>
    <ul class="card-grid" style="list-style:none;margin:0;padding:0">${CHANNELS.map((k) => {
      const p = PLATFORMS[k];
      const objs = OBJECTS.filter((o) => o.platforms.includes(k));
      const month = BOOKINGS.filter((b) => b.src === k && active(b) && b.from.getMonth() === TODAY.getMonth()).length;
      return `<li class="card stack-12">
        <div class="between" style="align-items:center"><span class="row" style="gap:12px"><span class="plat-logo" style="background:${p.color};color:${p.ink}">${p.name[0]}</span><span class="stack"><b class="name">${p.name}</b><span class="meta">Синхронизация ${SYNC[k] === 0 ? 'только что' : `${SYNC[k]} мин назад`}</span></span></span><span class="tag tag--ok">Подключено</span></div>
        <dl class="kv"><div><dt>Объектов</dt><dd>${objs.length} из ${OBJECTS.length}</dd></div><div><dt>Броней в ${MONTHS_PREP[TODAY.getMonth()]}</dt><dd>${month}</dd></div></dl>
        <button class="btn-sec" type="button" data-sync="${k}">${I('refresh')}Синхронизировать сейчас</button>
      </li>`;
    }).join('')}
      <li class="card stack-12" style="border-style:dashed">
        <span class="row" style="gap:12px"><span class="plat-logo" style="background:var(--soft);color:var(--rr-violet)">${I('plus')}</span><span class="stack"><b class="name">Другая площадка</b><span class="meta">Подключим по договорённости: Ostrovok B2B, Отелло, ЦИАН Посуточно и другие</span></span></span>
        <button class="btn-sec" type="button" data-chat>${I('chat')}Написать агенту</button>
      </li>
    </ul>
    <section class="section"><h2 class="section-title">Как идёт синхронизация</h2>
      <ol class="flow">
        <li class="card"><b>Площадка присылает бронь</b><span class="meta">Бронь сразу видна на главной и в календаре</span></li>
        <li class="card"><b>Вы подтверждаете</b><span class="meta">Одной кнопкой здесь, заходить на площадку не нужно</span></li>
        <li class="card"><b>Агент закрывает даты</b><span class="meta">На остальных площадках этого объекта, обычно за минуту</span></li>
      </ol>
    </section>`;
  page.addEventListener('click', async (e) => {
    if (e.target.closest('[data-chat]')) { openChat(); return; }
    const s = e.target.closest('[data-sync]');
    if (!s) return;
    s.disabled = true;
    s.querySelector('svg').style.animation = 'spin .8s linear infinite';
    await sleep(1100);
    SYNC[s.dataset.sync] = 0;
    toast(`${PLATFORMS[s.dataset.sync].name}: брони и даты сверены, расхождений нет`);
    App.rerender();
  });
}

function updateBadge() {
  const n = BOOKINGS.filter((b) => b.status === 'new').length;
  const el = $('#bell-badge');
  el.hidden = !n;
  el.textContent = n;
}

function openNotifications() {
  Sheet.open((body) => {
    const newB = BOOKINGS.filter((b) => b.status === 'new');
    body.innerHTML = `<div class="stack-16"><h2 class="sheet-title">Уведомления</h2>
      ${newB.length ? `<section class="section"><h3 class="section-title">Ждут подтверждения</h3><ul class="card-list">${newB.map((b) => bookingCard(b, { actions: true })).join('')}</ul></section>` : ''}
      <section class="section"><h3 class="section-title">Синхронизация</h3><ul class="card-list">${LOG.map((l) => `<li class="card"><div class="row" style="align-items:flex-start"><span class="tag" style="min-width:52px;justify-content:center">${hhmm(l.at)}</span><span class="grow" style="font-size:14px">${esc(l.text)}</span></div></li>`).join('')}</ul></section></div>`;
    body.onclick = (e) => {
      const c = e.target.closest('[data-confirm]');
      if (c) { e.stopPropagation(); confirmBooking(c.dataset.confirm, c.closest('[data-actions]')); return; }
      const r = e.target.closest('[data-reject]');
      if (r) { rejectBooking(r.dataset.reject); return; }
      const card = e.target.closest('[data-booking]');
      if (card) openBooking(card.dataset.booking);
    };
  });
}

/* Агент внутри приложения */
const CHAT_LOG = [{ html: 'Я агент Букинг-CRM. Спросите про заезды, загрузку или попросите закрыть даты: например, «закрой 20–22 на Студии».' }];
function answer(text) {
  const t = text.toLowerCase();
  if (/сегодня|заезд|выезд/.test(t)) {
    const ci = BOOKINGS.filter((b) => active(b) && b.status !== 'new' && sameDay(b.from, TODAY));
    const co = BOOKINGS.filter((b) => active(b) && b.status !== 'new' && sameDay(b.to, TODAY));
    return `Сегодня ${ci.length} ${plural(ci.length, 'заезд', 'заезда', 'заездов')} и ${co.length} ${plural(co.length, 'выезд', 'выезда', 'выездов')}.<br>${ci.map((b) => `Заезд: ${esc(b.guest)}, ${esc(obj(b.obj).name)}`).join('<br>')}${ci.length && co.length ? '<br>' : ''}${co.map((b) => `Выезд: ${esc(b.guest)}, ${esc(obj(b.obj).name)}`).join('<br>')}`;
  }
  if (/загруз|выручк|деньг|доход/.test(t)) {
    const s = monthStats(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
    return `В ${MONTHS_PREP[TODAY.getMonth()]} загрузка ${Math.round(s.occ * 100)}%, продано ${s.nights} ${plural(s.nights, 'ночь', 'ночи', 'ночей')} на ${rub(s.revenue)}. Средняя цена ночи ${rub(s.avg)}.`;
  }
  if (/закро|закрой|закрыть/.test(t)) {
    const m = t.match(/(\d{1,2})\s*(?:[–-]|до|по)\s*(\d{1,2})/) || t.match(/(\d{1,2})/);
    const o = OBJECTS.find((x) => t.includes(x.name.toLowerCase().split(' ')[0].slice(0, 5))) || OBJECTS[0];
    if (!m) return 'Напишите числа, например «закрой 20–22 на Студии».';
    const a = Number(m[1]), b = Number(m[2] || m[1]);
    const ref = new Date(TODAY.getFullYear(), TODAY.getMonth() + (a < TODAY.getDate() ? 1 : 0), 1);
    const busy = [];
    for (let d = a; d <= b; d++) {
      const day = new Date(ref.getFullYear(), ref.getMonth(), d);
      if (occupying(o.id, day)) busy.push(d); else BLOCKS.add(`${o.id}|${dkey(day)}`);
    }
    LOG.unshift({ at: new Date(), text: `${o.name}: ${a}–${b} ${MONTHS_GEN[ref.getMonth()]} закрыто вручную через агента.` });
    App.rerender();
    return `Закрыл ${a === b ? a : `${a}–${b}`} ${MONTHS_GEN[ref.getMonth()]} на объекте «${esc(o.name)}» на ${o.platforms.length} площадках.${busy.length ? ` Дни ${busy.join(', ')} уже были заняты бронями.` : ''}`;
  }
  if (/нов|подтвер/.test(t)) {
    const n = BOOKINGS.filter((b) => b.status === 'new');
    return n.length ? `Ждут подтверждения ${n.length}:<br>${n.map((b) => `${esc(b.guest)}, ${esc(obj(b.obj).name)}, ${range(b.from, b.to)}`).join('<br>')}` : 'Новых броней нет.';
  }
  return 'Могу показать заезды и выезды, посчитать загрузку, перечислить новые брони или закрыть даты на всех площадках. В демо ответы собираются из данных этой страницы.';
}
function openChat() { openAgentChat({ log: CHAT_LOG, quick: ['Что сегодня?', 'Загрузка за месяц', 'Закрой 20–22 на Студии'], answer }); }
