<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Строй-учёт</title>
<meta name="theme-color" content="#141414">
<meta name="description" content="Строй-учёт РОБОРАБ: смета по фото, этапы и отчёты бригад, камеры на объектах.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Строй-учёт">
<link rel="stylesheet" href="../booking/fonts/fonts.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="./roborab-ui.css">
<style>
/* Общая раскладка демо РОБОРАБ поверх roborab-ui.css. Монохром: чёрная основа, фиолетовый #0A84FF акцентом.
   Раскладка: фиксированная шапка, нижний тачбар до 900 px, боковое меню от 900 px,
   справа выезжает панель карточки. Светлая тема, как во всех приложениях РОБОРАБ. */
:root {
  --bg: #f4f4f2;
  --surface: #ffffff;
  --text: #141414;
  --text-2: color-mix(in srgb, #141414 66%, #ffffff);
  --text-3: color-mix(in srgb, #141414 56%, #ffffff);
  --border: rgb(20 20 20 / 0.12);
  --border-strong: rgb(20 20 20 / 0.22);
  --soft: color-mix(in srgb, #141414 9%, #ffffff);
  --soft-2: color-mix(in srgb, #141414 16%, #ffffff);
  --pressed: color-mix(in srgb, #141414 82%, #000000);
  --on-violet: rgb(255 255 255 / 0.74);
  --warn: #c98617;
  --warn-soft: color-mix(in srgb, #e0a33c 16%, #ffffff);
  --danger: #d2483a;
  --danger-soft: color-mix(in srgb, #df5c4e 14%, #ffffff);
  --ok: #23845a;
  --ok-soft: color-mix(in srgb, #2f9e6e 14%, #ffffff);
  --shadow-raised: 0 12px 32px -16px rgb(0 0 0 / 0.28);
  --panel-w: 560px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.45 var(--rr-font);
  -webkit-font-smoothing: antialiased;
}
/* Под статус-баром отдельной подложки нет: шапка закрывает его сама, при прокрутке проявляется стекло .rr-scroll-status. Как в Beauty Box. */
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--rr-violet); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.tertiary { color: var(--text-3); }
.nowrap { white-space: nowrap; }

/* Шапка и навигация */
.app-header { position: fixed; inset: 0 0 auto; z-index: 41; }
.app-header .rr-header-row { grid-template-columns: minmax(0, 1fr) auto auto; }
.app-header .rr-header-action { position: relative; }
.badge {
  position: absolute;
  top: 6px;
  right: 4px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--rr-lime);
  color: #fff;
  font: 800 11px/18px var(--rr-display);
  text-align: center;
}
@media (max-width: 899px) { .rr-rail { display: none; } }
.rail-foot {
  margin-top: auto;
  padding: 12px 16px 4px;
  color: var(--text-3);
  font: italic 900 15px/1 var(--rr-display);
  letter-spacing: -.02em;
}

main {
  padding-top: calc(var(--rr-header-height) + 24px);
  padding-bottom: calc(var(--rr-dock-space) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 900px) {
  main {
    margin-left: var(--rr-rail-width);
    padding-top: calc(var(--rr-header-height) + 32px);
    padding-bottom: 48px;
    padding-left: max(32px, env(safe-area-inset-left, 0px));
    padding-right: max(32px, env(safe-area-inset-right, 0px));
  }
}
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
.page > * { min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title {
  margin: 0;
  font: italic 900 30px/1.02 var(--rr-display);
  letter-spacing: -.035em;
  text-wrap: balance;
}
.page-sub { margin: 6px 0 0; color: var(--text-2); }
.section { display: grid; gap: 12px; }
.section-title {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--text-3);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.section-title .link-btn { text-transform: none; letter-spacing: 0; }
.grid-2 { display: grid; gap: 28px; }
@media (min-width: 1100px) { .grid-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }

/* Плитки: фиолетовые, цифра лаймом */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile {
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  min-height: 116px;
  padding: 16px;
  border: 0;
  border-radius: 28px;
  background: var(--rr-violet);
  color: #fff;
  text-align: left;
  transition: transform .3s var(--rr-ease), background .3s var(--rr-ease);
}
.tile-title { font: 700 14px/1.25 var(--rr-font); }
.tile-count {
  font: italic 900 clamp(34px, 30cqi, 56px)/1 var(--rr-display);
  letter-spacing: -.04em;
  color: var(--rr-lime);
  font-variant-numeric: tabular-nums;
}
.tile-note { font-size: 13px; color: var(--on-violet); }
.tile--ink { background: var(--rr-lime); }
.tile--ink .tile-count { color: #fff; }
.tile--light { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.tile--light .tile-count { color: var(--rr-violet); }
.tile--light .tile-note { color: var(--text-2); }
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .tile:hover { transform: translateY(-3px) rotate(-1deg); }
}

/* Карточки и списки */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 16px;
}
.card--tap { cursor: pointer; transition: box-shadow .2s var(--rr-ease), transform .2s var(--rr-ease); }
@media (hover: hover) { .card--tap:hover { box-shadow: var(--shadow-raised); transform: translateY(-1px); } }
.card-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.card-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.between { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.stack { display: grid; gap: 4px; min-width: 0; }
.stack-8 { display: grid; gap: 8px; min-width: 0; }
.stack-12 { display: grid; gap: 12px; min-width: 0; }
.name { font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--text-2); }
.sum { font: italic 900 20px/1.1 var(--rr-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.divider { height: 1px; background: var(--border); border: 0; margin: 4px 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--text-3); }

/* Денежная карточка */
.money { background: var(--rr-violet); border-color: transparent; color: #fff; }
.money .meta, .money .muted { color: var(--on-violet); }
.money-value {
  font: italic 900 clamp(34px, 8vw, 52px)/1.04 var(--rr-display);
  letter-spacing: -.04em;
  color: var(--rr-lime);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.money-rows { display: grid; gap: 8px; margin: 16px 0 0; }
.money-row { display: flex; justify-content: space-between; gap: 12px; }
.money-row dt { color: var(--on-violet); }
.money-row dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.money hr { border: 0; height: 1px; background: rgb(255 255 255 / .22); margin: 16px 0; }

/* Полосы прогресса */
.bar { height: 8px; border-radius: 999px; background: var(--soft-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--rr-violet); }
.money .bar { background: rgb(255 255 255 / .18); }
.money .bar > span { background: var(--rr-lime); }
.bar--warn > span { background: var(--warn); }
.bar--danger > span { background: var(--danger); }
.stackbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; }
.stackbar > span { display: block; height: 100%; }

/* Кнопки, чипы, метки */
.btn-sec {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--rr-violet);
  font: normal 800 15px/1 var(--rr-display);
  text-decoration: none;
  transition: border-color .2s var(--rr-ease), background .2s var(--rr-ease);
}
@media (hover: hover) { .btn-sec:hover { border-color: var(--rr-violet); background: var(--soft); } }
.btn-sec:disabled { opacity: .5; cursor: default; }
.btn-sec svg, .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.btn-sec--danger { color: var(--danger); }
.btn-wide { width: 100%; }
.link-btn { border: 0; background: none; padding: 0; color: var(--rr-violet); font-weight: 700; font-size: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips--wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  flex: none;
  min-height: 40px;
  padding: 0 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  transition: border-color .2s var(--rr-ease), background .2s var(--rr-ease), color .2s var(--rr-ease);
}
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--rr-violet); color: var(--rr-violet); }
@media (hover: hover) { .chip:hover { border-color: var(--rr-violet); } }
.chip .count { margin-left: 6px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--rr-violet);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.tag--ok { background: var(--ok-soft); color: var(--ok); }
.tag--warn { background: var(--warn-soft); color: var(--warn); }
.tag--danger { background: var(--danger-soft); color: var(--danger); }
.tag--ink { background: var(--rr-ink); color: #fff; }
.tag--lime { background: var(--rr-lime); color: #fff; }
.dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--text-3); }
.t-warn { color: var(--warn); font-weight: 700; }
.t-danger { color: var(--danger); font-weight: 700; }
.t-ok { color: var(--ok); font-weight: 700; }

/* Аватарка: лаймовый круг, фиолетовые инициалы */
.avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--rr-lime);
  color: #fff;
  font: 800 14px/1 var(--rr-display);
}
.avatar--lg { width: 56px; height: 56px; font-size: 18px; }

/* Поиск и поля */
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
}
.search:focus-within { border-color: var(--rr-violet); }
.search svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--text-3); stroke-width: 1.75; stroke-linecap: round; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--text-2); }
.field input, .field textarea, .field select {
  width: 100%;
  min-height: 48px;
  padding: 12px 16px;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  background: var(--surface);
  font-size: 16px;
  outline: 0;
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--rr-violet); }
.form-row { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* Панель справа (на телефоне во весь экран) */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgb(20 20 20 / .34);
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s var(--rr-ease);
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  z-index: 51;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  transform: translateX(104%);
  transition: transform .45s var(--rr-ease);
  visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet .rr-header { flex: none; }
.sheet .rr-header-row { grid-template-columns: auto minmax(0, 1fr) auto; }
.sheet-body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-top: 24px;
  padding-bottom: calc(32px + var(--rr-safe-bottom));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-body > .stack-16 { display: grid; gap: 20px; }
.sheet-title { margin: 0; font: italic 900 26px/1.05 var(--rr-display); letter-spacing: -.035em; text-wrap: balance; }
@media (min-width: 900px) {
  .sheet {
    inset: 12px 12px 12px auto;
    width: min(var(--panel-w), calc(100% - 24px));
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgb(20 20 20 / .45);
  }
  .sheet .rr-header { border-radius: 0 0 28px 28px; }
  .sheet-body { padding-left: 24px; padding-right: 24px; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } }

.kv { display: grid; gap: 10px; margin: 0; }
.kv > div { display: flex; justify-content: space-between; gap: 16px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; font-weight: 700; text-align: right; overflow-wrap: anywhere; }

/* Тост */
.toast {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: calc(var(--rr-dock-space) + 12px);
  width: max-content;
  max-width: min(440px, calc(100% - 32px));
  padding: 14px 18px;
  border-radius: 22px;
  background: var(--rr-ink);
  color: #fff;
  font-weight: 600;
  box-shadow: var(--shadow-raised);
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s var(--rr-ease), transform .3s var(--rr-ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { .toast { bottom: 24px; left: calc(50% + var(--rr-rail-width) / 2); } }

/* Шаги работы агента */
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; align-items: center; gap: 10px; color: var(--text-3); transition: color .3s; }
.steps li.done { color: var(--text); }
.steps li.run { color: var(--rr-violet); font-weight: 700; }
.step-mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
}
.steps li.done .step-mark { background: var(--rr-violet); border-color: var(--rr-violet); color: #fff; }
.step-mark svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.steps li.run .step-mark { border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .steps li.run .step-mark { animation: none; } }

/* Чат агента внутри приложения */
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 86%; padding: 12px 16px; }
.msg-wrap { display: flex; }
.msg-wrap.user { justify-content: flex-end; }
.chat-compose { flex: none; padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + var(--rr-safe-bottom)); }
@media (min-width: 900px) { .chat-compose { padding: 12px 24px 20px; } }
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chat-bg { background: radial-gradient(120% 70% at 100% 0%, var(--soft-2), transparent 60%), var(--bg); }

.demo-note {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px 16px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  color: var(--text-2);
  font-size: 13px;
}
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.thumb { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; background: var(--soft); }
.thumb svg, .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .4s var(--rr-ease) both; }
@media (prefers-reduced-motion: reduce) { .rise { animation: none; } }

/* Строй-учёт: фото отчётов, этапы, камеры, смета */
.tile-of { font-size: .5em; color: var(--on-violet); letter-spacing: 0; }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.shots .thumb { border-radius: 14px; aspect-ratio: 4 / 3; }
.money-obj { display: grid; gap: 6px; width: 100%; padding: 0; border: 0; background: none; color: #fff; text-align: left; }
.money-obj .meta { font-size: 12px; }
.money .bar--hot > span, .bar--hot > span { background: #ffb3a8; }
.bar--hot { background: rgb(255 255 255 / .18); }
.card .bar--hot { background: var(--danger-soft); }
.card:not(.money) .bar--hot > span { background: var(--danger); }
.obj-cover { position: relative; aspect-ratio: 16 / 9; }
.obj-pct { position: absolute; right: 10px; bottom: 10px; padding: 6px 12px; border-radius: 999px; background: var(--rr-lime); color: #fff; font: italic 900 20px/1 var(--rr-display); letter-spacing: -.03em; }
.line { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 20px; }

.timeline { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.tl { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.tl::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: -12px; width: 2px; background: var(--border); }
.tl:last-child::before { display: none; }
.tl.done::before { background: var(--rr-violet); }
.st { position: relative; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; margin-top: 14px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--surface); }
.st svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.st--done { background: var(--rr-violet); border-color: var(--rr-violet); color: #fff; }
.st--review { background: var(--rr-lime); border-color: var(--rr-ink); }
.st--work { border-color: var(--rr-violet); box-shadow: inset 0 0 0 5px var(--soft-2); }
.st--late { border-color: var(--danger); box-shadow: inset 0 0 0 5px var(--danger-soft); }
.tl.todo .card { background: transparent; border-style: dashed; }

.cam-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.cam {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  padding: 0;
  border: 0;
  border-radius: 24px;
  overflow: hidden;
  background: #07121f;
  color: #fff;
  text-align: left;
}
.cam > svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(.85) contrast(1.05); }

function I(name, cls = 'ico') {
  return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const RUB = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const rub = (n) => `${RUB.format(Math.round(n))} ₽`;
const mln = (n) => n >= 1e6 ? `${(n / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: 1 })} млн ₽` : rub(n);
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };

const DAY = 86400000;
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const diffDays = (a, b) => Math.round((a - b) / DAY);
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTHS_PREP = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const fd = (d) => `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
const fdShort = (d) => `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}`;
const range = (a, b) => a.getMonth() === b.getMonth()
  ? `${a.getDate()}–${b.getDate()} ${MONTHS_GEN[a.getMonth()]}`
  : `${fd(a)} – ${fd(b)}`;
const relDay = (d) => { const day = new Date(d); day.setHours(0, 0, 0, 0); const k = diffDays(day, TODAY); return k === 0 ? 'сегодня' : k === 1 ? 'завтра' : k === -1 ? 'вчера' : fd(d); };
const hhmm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const initials = (name) => { const p = name.replace(/[.]/g, ' ').trim().split(/\s+/); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* Тост */
let toastTimer;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* Панель справа. Одна на приложение, содержимое меняется. */
const Sheet = {
  stack: [],
  open(render, opts = {}) {
    this.stack.push({ render, opts });
    this.paint();
    $('#sheet').classList.add('open');
    $('#scrim').classList.add('open');
    document.documentElement.style.overflow = 'hidden';
  },
  replace(render, opts = {}) { this.stack[this.stack.length - 1] = { render, opts }; this.paint(); },
  refresh() { if (this.stack.length) this.paint(true); },
  back() {
    this.stack.pop();
    if (this.stack.length) this.paint(); else this.close();
  },
  close() {
    this.stack = [];
    $('#sheet').classList.remove('open');
    $('#scrim').classList.remove('open');
    document.documentElement.style.overflow = '';
    if (typeof onSheetClosed === 'function') onSheetClosed();
  },
  paint(keepScroll) {
    const top = this.stack[this.stack.length - 1];
    const body = $('#sheet-body');
    const y = body.scrollTop;
    $('#sheet').classList.toggle('chat-bg', !!top.opts.chat);
    $('#sheet-back').innerHTML = this.stack.length > 1 ? I('back') : I('close');
    $('#sheet-back').setAttribute('aria-label', this.stack.length > 1 ? 'Назад' : 'Закрыть');
    body.innerHTML = '';
    const footer = $('#sheet-footer');
    footer.innerHTML = '';
    footer.hidden = true;
    top.render(body, footer);
    if (footer.innerHTML) footer.hidden = false;
    body.scrollTop = keepScroll ? y : 0;
  },
};

/* Маршруты по хешу: #home, #calendar и так далее */
function setupRouter(views, start) {
  const go = (keep) => {
    const name = (location.hash || '').slice(1);
    const view = views[name] ? name : start;
    for (const a of $$('[data-view]')) {
      if (a.dataset.view === view) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    const main = $('#main');
    main.innerHTML = '';
    const page = document.createElement('div');
    page.className = 'page';
    main.appendChild(page);
    const y = window.scrollY;
    views[view](page);
    if (keep && App.view === view) window.scrollTo(0, y);
    else { window.scrollTo(0, 0); document.dispatchEvent(new Event('rr:header-reset')); }
    App.view = view;
  };
  window.addEventListener('hashchange', () => go(false));
  go(false);
  return () => go(true);
}
function navTo(view) {
  if (location.hash === '#' + view) App.rerender(); else location.hash = view;
}

/* Навигация: одна разметка для тачбара и бокового меню */
function buildNav(tabs, product) {
  const html = tabs.map((t) => `<a class="rr-tab" href="#${t.id}" data-view="${t.id}">${I(t.icon)}<span class="rr-tab-label">${t.label}</span></a>`).join('');
  $('#dock').innerHTML = html;
  $('#rail').innerHTML = html + `<div class="rail-foot">${esc(product)}</div>`;
}

/* Чат агента РОБОРАБ внутри приложения */
function openAgentChat(cfg) {
  const log = cfg.log;
  Sheet.open((body, footer) => {
    body.innerHTML = `<div class="chat" id="chat-list" aria-live="polite"></div>`;
    const list = $('#chat-list', body);
    const draw = () => {
      list.innerHTML = log.map((m) => `<div class="msg-wrap ${m.me ? 'user' : ''}"><div class="rr-message msg ${m.me ? 'rr-message--user' : ''}">${m.html || esc(m.text)}</div></div>`).join('');
      body.scrollTop = body.scrollHeight;
    };
    draw();
    footer.className = 'chat-compose';
    footer.innerHTML = `
      <div class="quick">${cfg.quick.map((q) => `<button class="chip" type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <form class="rr-composer" id="chat-form">
        <textarea id="chat-input" rows="1" placeholder="Напишите агенту" aria-label="Сообщение агенту"></textarea>
        <button class="rr-composer-control rr-composer-send" type="submit" aria-label="Отправить" disabled>${I('send')}</button>
      </form>`;
    const input = $('#chat-input', footer);
    const sendBtn = $('.rr-composer-send', footer);
    const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 148) + 'px'; sendBtn.disabled = !input.value.trim(); };
    input.addEventListener('input', grow);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#chat-form', footer).requestSubmit(); } });
    const ask = async (text) => {
      if (!text.trim()) return;
      log.push({ me: true, text });
      draw();
      log.push({ html: '<span class="tertiary">Агент печатает…</span>' });
      draw();
      await sleep(700);
      log.pop();
      log.push({ html: cfg.answer(text) });
      draw();
    };
    $('#chat-form', footer).addEventListener('submit', (e) => { e.preventDefault(); const t = input.value; input.value = ''; grow(); ask(t); });
    footer.addEventListener('click', (e) => { const q = e.target.closest('[data-q]'); if (q) ask(q.dataset.q); });
  }, { chat: true });
}

    return `<svg viewBox="0 0 320 240" preserveAspectRatio="xMidYMid slice" style="${tint}" role="img" aria-label="Снимок объекта">

let objTab = 'stages';
function openObject(id, tab) {
  if (tab) objTab = tab;
  Sheet.open((body) => {
    const o = obj(id), b = brig(o.brigade), pr = progress(o);
    const tabs = [['stages', 'Этапы'], ['estimate', 'Смета'], ['costs', 'Затраты'], ['cameras', 'Камеры'], ['reports', 'Отчёты']];
    body.innerHTML = `<div class="stack-16">
      <div class="thumb obj-cover" style="aspect-ratio:16/9">${o.photo ? `<img src="${o.photo}" alt="${esc(o.name)}">` : siteScene(o.cover, o.id.charCodeAt(1) + 5)}${o.photoNote ? `<span class="tag tag--ink obj-note">${o.photoNote}</span>` : ''}</div>
      <div><h2 class="sheet-title">${esc(o.name)}</h2><p class="meta" style="margin:6px 0 0">${esc(o.type)} · ${esc(o.addr)}</p></div>
      <div class="card stack-8"><div class="between"><span class="meta">Готовность</span><b class="num">${pr}%</b></div><div class="bar"><span style="width:${pr}%"></span></div>
        <dl class="kv" style="margin-top:8px"><div><dt>Заказчик</dt><dd>${esc(o.client)}</dd></div><div><dt>Бригада</dt><dd>${esc(b.boss)}, ${b.members.length} чел.</dd></div><div><dt>Сдача</dt><dd>${fd(o.stages[o.stages.length - 1].end)}</dd></div></dl></div>
      <div class="chips" role="tablist">${tabs.map(([k, t]) => `<button class="chip" type="button" role="tab" data-otab="${k}" aria-pressed="${objTab === k}" aria-selected="${objTab === k}">${t}</button>`).join('')}</div>
      <div id="otab"></div>
    </div>`;
    const pane = $('#otab', body);
    const drawTab = () => {
      if (objTab === 'stages') {
        pane.innerHTML = `<ol class="timeline">${o.stages.map((s) => `<li class="tl ${s.status}">${stageDot(s)}<div class="card stack-8">
          <div class="between"><b>${esc(s.name)}</b>${stageTag(s)}</div>
          <span class="meta num">${fdShort(s.start)}–${fdShort(s.end)} · работы ${rub(s.cost)}</span>
          ${s.status === 'review' ? `<button class="btn" type="button" data-stage-ok="${s.i}">${I('check')}Принять этап</button>` : ''}
          ${s.status === 'work' ? `<button class="link-btn" type="button" data-stage-ask="${s.i}" style="justify-self:start">Запросить фотоотчёт</button>` : ''}
        </div></li>`).join('')}</ol>`;
      } else if (objTab === 'estimate') {
        const works = o.stages.reduce((a, s) => a + s.cost, 0);
        const mats = o.materials.reduce((a, m) => a + m.qty * m.price, 0);
        pane.innerHTML = `<div class="stack-12">
          <div class="card money"><div class="meta">Смета объекта</div><div class="money-value">${rub(works + mats)}</div>
            <dl class="money-rows"><div class="money-row"><dt>Работы</dt><dd>${rub(works)}</dd></div><div class="money-row"><dt>Материалы</dt><dd>${rub(mats)}</dd></div></dl></div>
          <h3 class="section-title">Работы</h3>
          <ul class="card-list">${o.stages.map((s) => `<li class="card line"><span class="grow">${esc(s.name)}</span><b class="num nowrap">${rub(s.cost)}</b></li>`).join('')}</ul>
          <h3 class="section-title">Материалы</h3>
          <ul class="card-list">${o.materials.map((m) => `<li class="card line"><span class="grow stack"><span>${esc(m.name)}</span><span class="meta num">${String(m.qty).replace('.', ',')} ${m.unit} × ${rub(m.price)}</span></span><b class="num nowrap">${rub(m.qty * m.price)}</b></li>`).join('')}</ul>
          <button class="btn-sec" type="button" data-go-estimate>${I('camera')}Досчитать смету по фото</button>
        </div>`;
      } else if (objTab === 'costs') {
        const s = spent(o), p = s / o.budget;
        pane.innerHTML = `<div class="stack-12">
          <div class="card money"><div class="meta">Потрачено</div><div class="money-value">${rub(s)}</div>
            <div class="bar ${p > .92 ? 'bar--hot' : ''}" style="margin-top:12px"><span style="width:${Math.min(100, p * 100)}%"></span></div>
            <dl class="money-rows"><div class="money-row"><dt>Бюджет</dt><dd>${rub(o.budget)}</dd></div><div class="money-row"><dt>Осталось</dt><dd>${rub(o.budget - s)}</dd></div></dl></div>
          <form class="card stack-12" id="exp-form" novalidate>
            <b>Новая затрата</b>
            <div class="field"><label for="exp-name">Что купили или оплатили</label><input id="exp-name" placeholder="Например: плиточный клей, 40 мешков"></div>
            <div class="field"><label for="exp-sum">Сумма, ₽</label><input id="exp-sum" inputmode="numeric" placeholder="0"></div>
            <div class="chips chips--wrap" id="exp-cat">${['Материалы', 'Работы', 'Техника', 'Прочее'].map((c, i) => `<button class="chip" type="button" data-cat="${c}" aria-pressed="${i === 0}">${c}</button>`).join('')}</div>
            <button class="btn" type="submit">${I('plus')}Добавить</button>
          </form>
          <h3 class="section-title">Последние затраты</h3>
          <ul class="card-list">${[...o.expenses].sort((a, b) => b.date - a.date).map((e) => `<li class="card line"><span class="grow stack"><span>${esc(e.name)}</span><span class="meta">${relDay(e.date)} · ${e.cat}</span></span><b class="num nowrap">${rub(e.sum)}</b></li>`).join('')}</ul>
        </div>`;
        $('#exp-form', pane).onsubmit = (ev) => {
          ev.preventDefault();
          const name = $('#exp-name', pane).value.trim();
          const sum = parseInt($('#exp-sum', pane).value.replace(/\D/g, ''), 10);
          if (!name) { toast('Напишите, за что затрата'); return; }
          if (!sum) { toast('Укажите сумму'); return; }
          o.expenses.push({ date: new Date(TODAY), name, sum, cat: $('#exp-cat [aria-pressed="true"]', pane).dataset.cat });
          toast(`Затрата ${rub(sum)} добавлена в «${o.name}»`);
          drawTab(); App.rerender();
        };
      } else if (objTab === 'cameras') {
        pane.innerHTML = `<div class="stack-12">${o.cameras.map((c, i) => camTile(o, c, i, true)).join('')}
          <div class="demo-note">${I('video')}Камеры подключаются по RTSP или через облако производителя. В демо показан снимок.</div></div>`;
      } else {
        const rs = REPORTS.filter((r) => r.obj === o.id).sort((a, b) => b.at - a.at);
        pane.innerHTML = `<ul class="card-list">${rs.map((r) => reportCard(r, { actions: true })).join('') || '<li class="card empty">Отчётов пока нет</li>'}</ul>`;
      }
    };
    drawTab();
    bindReports(pane);
    body.onclick = (e) => {
      const t = e.target.closest('[data-otab]');
      if (t) { objTab = t.dataset.otab; $$('[data-otab]', body).forEach((x) => { x.setAttribute('aria-pressed', x === t); x.setAttribute('aria-selected', x === t); }); drawTab(); return; }
      const ok = e.target.closest('[data-stage-ok]');
      if (ok) {
        const s = o.stages[Number(ok.dataset.stageOk)];
        const r = REPORTS.find((x) => x.obj === o.id && x.stage === s.i && x.status === 'review');
        if (r) acceptReport(r.id); else { s.status = 'done'; toast(`Этап «${s.name}» принят`); App.rerender(); Sheet.refresh(); }
        return;
      }
      const ask = e.target.closest('[data-stage-ask]');
      if (ask) { toast(`${brig(o.brigade).boss} получил запрос на фотоотчёт по этапу «${o.stages[Number(ask.dataset.stageAsk)].name}»`); return; }
      if (e.target.closest('[data-go-estimate]')) { est.obj = o.id; Sheet.close(); navTo('estimate'); return; }
      const cat = e.target.closest('[data-cat]');
      if (cat) { $$('[data-cat]', body).forEach((x) => x.setAttribute('aria-pressed', x === cat)); return; }
      const cam = e.target.closest('[data-cam]');
      if (cam) openCamera(cam.dataset.cam);
    };
  });
}

/* Смета по фото или проекту */
const est = { mode: 'photo', obj: 's2', file: null, result: null, running: false };
// Открываемся с готовым примером, чтобы было видно, что получится
const PRICE = {
  works: [['Грунтовка стен', 'walls', 'м²', 90], ['Штукатурка по маякам', 'walls', 'м²', 650], ['Шпаклёвка под покраску', 'walls', 'м²', 380], ['Покраска в два слоя', 'walls', 'м²', 320], ['Стяжка пола до 50 мм', 'floor', 'м²', 750], ['Укладка ламината с подложкой', 'floor', 'м²', 450], ['Натяжной потолок', 'floor', 'м²', 900], ['Электроточки: розетки и выключатели', 'points', 'шт.', 1500]],
  mats: [['Штукатурка гипсовая, 30 кг', (a) => Math.ceil(a.walls * 0.3), 'меш.', 520], ['Грунт глубокого проникновения, 10 л', (a) => Math.ceil(a.walls / 60), 'кан.', 980], ['Шпаклёвка финишная, 20 кг', (a) => Math.ceil(a.walls / 14), 'меш.', 890], ['Краска интерьерная, 9 л', (a) => Math.ceil(a.walls / 22), 'ведро', 4200], ['Пескобетон М300, 40 кг', (a) => Math.ceil(a.floor * 1.25), 'меш.', 290], ['Ламинат 33 класс', (a) => Math.ceil(a.floor * 1.08), 'м²', 1350], ['Кабель ВВГнг 3×2,5', (a) => a.points * 6, 'м', 95]],
};
function buildEstimate(mode) {
  const a = mode === 'photo'
    ? { title: 'Комната по фото', walls: 47, floor: 18.6, points: 9, note: 'Высота потолка 2,7 м, одно окно 1,4×1,6 м, дверной проём 0,9 м' }
    : { title: 'Квартира 64 м² по проекту', walls: 168, floor: 64, points: 34, note: 'Три помещения и коридор, санузел считается отдельно' };
  const works = PRICE.works.map(([name, k, unit, price]) => ({ name, qty: a[k], unit, price }));
  const mats = PRICE.mats.map(([name, f, unit, price]) => ({ name, qty: f(a), unit, price }));
  return { ...a, works, mats, totalW: works.reduce((s, x) => s + x.qty * x.price, 0), totalM: mats.reduce((s, x) => s + x.qty * x.price, 0) };
}
est.result = buildEstimate('photo');
const qty = (n) => String(Math.round(n * 10) / 10).replace('.', ',');

function viewEstimate(page) {
  const r = est.result;
  page.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Смета</h1><p class="page-sub">Сфотографируйте помещение или загрузите проект. Агент посчитает работы и материалы, специалист проверит</p></div></div>
    <div class="grid-2">
      <div class="stack-12" style="gap:20px">
        <div class="mode-grid" role="group" aria-label="Источник">
          <button type="button" class="mode card" data-mode="photo" aria-pressed="${est.mode === 'photo'}">${I('camera')}<b>По фото</b><span class="meta">Одно помещение, 2–4 снимка</span></button>
          <button type="button" class="mode card" data-mode="project" aria-pressed="${est.mode === 'project'}">${I('file')}<b>По проекту</b><span class="meta">План квартиры или дома, PDF или картинка</span></button>
        </div>
        <label class="drop" for="est-file" id="drop">
          ${est.file ? (est.file.url ? `<img src="${est.file.url}" alt="Загруженный файл">` : `<span class="drop-file">${I('file')}<b>${esc(est.file.name)}</b></span>`)
            : est.mode === 'photo' ? `<span class="drop-sample"><img src="${PHOTOS['apartment-raw']}" alt="Пример: комната перед ремонтом"></span>` : `<span class="drop-sample plan">${planSVG()}</span>`}
          <span class="drop-cap">${I('upload')}${est.file ? 'Заменить' : est.mode === 'photo' ? 'Своё фото' : 'Свой проект'}</span>
        </label>
        <input type="file" id="est-file" accept="image/*,.pdf" hidden>
        <div class="field"><label>Объект</label><div class="chips chips--wrap">${OBJECTS.map((o) => `<button class="chip" type="button" data-eobj="${o.id}" aria-pressed="${est.obj === o.id}">${esc(o.name)}</button>`).join('')}</div></div>
        <button class="btn" type="button" id="est-run" ${est.running ? 'disabled' : ''}>${I('layers')}Посчитать смету</button>
        <div id="est-steps"></div>
      </div>
      <div id="est-result">${r ? estimateResult(r) : `<div class="card empty stack-8"><b style="color:var(--text)">Здесь будет смета</b><span>Работы и материалы с количеством и ценой. После проверки её можно добавить в объект.</span></div>`}</div>
    </div>`;
  $('#est-file', page).onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    est.file = { name: f.name, url: f.type.startsWith('image/') ? URL.createObjectURL(f) : null };
    est.result = null;
    App.rerender();
  };
  page.addEventListener('click', async (e) => {
    const m = e.target.closest('[data-mode]');
    if (m) { est.mode = m.dataset.mode; est.file = null; est.result = null; App.rerender(); return; }
    const ob = e.target.closest('[data-eobj]');
    if (ob) { est.obj = ob.dataset.eobj; $$('[data-eobj]', page).forEach((x) => x.setAttribute('aria-pressed', x === ob)); return; }
    if (e.target.closest('#est-run')) { runEstimate(page); return; }
    if (e.target.closest('#est-add')) {
      const o = obj(est.obj);
      const r2 = est.result;
      for (const w of r2.works) o.stages.push({ i: o.stages.length, name: w.name, status: 'todo', start: addDays(o.stages[o.stages.length - 1].end, 1), end: addDays(o.stages[o.stages.length - 1].end, 3), cost: Math.round(w.qty * w.price) });
      for (const x of r2.mats) o.materials.push({ ...x });
      o.budget += r2.totalW + r2.totalM;
      toast(`Смета на ${rub(r2.totalW + r2.totalM)} добавлена в «${o.name}»`);
      e.target.closest('#est-add').disabled = true;
      return;
    }
    if (e.target.closest('#est-copy')) {
      const r2 = est.result;
      const lines = ['Наименование\tКол-во\tЕд.\tЦена\tСумма', ...[...r2.works, ...r2.mats].map((x) => `${x.name}\t${qty(x.qty)}\t${x.unit}\t${x.price}\t${Math.round(x.qty * x.price)}`), `Итого\t\t\t\t${r2.totalW + r2.totalM}`].join('\n');
      try { await navigator.clipboard.writeText(lines); toast('Смета скопирована. Вставьте её в Excel или Google Таблицы'); } catch { toast('Не удалось скопировать. Выделите строки вручную'); }
    }
  });
}
async function runEstimate(page) {
  est.running = true;
  $('#est-run', page).disabled = true;
  const steps = est.mode === 'photo'
    ? ['Распознаём помещение на фото', 'Считаем площади: стены 47 м², пол 18,6 м²', 'Подбираем работы по виду отделки', 'Считаем материалы с запасом 8%', 'Ставим цены по Москве и области']
    : ['Читаем план и экспликацию', 'Находим помещения: 3 комнаты и коридор', 'Считаем площади: стены 168 м², пол 64 м²', 'Подбираем работы и материалы', 'Ставим цены по Москве и области'];
  const box = $('#est-steps', page);
  box.innerHTML = `<div class="card"><ul class="steps">${steps.map((t) => `<li><span class="step-mark">${I('check')}</span>${esc(t)}</li>`).join('')}</ul></div>`;
  for (const li of $$('li', box)) { li.classList.add('run'); await sleep(620); li.classList.remove('run'); li.classList.add('done'); }
  est.result = buildEstimate(est.mode);
  est.running = false;
  $('#est-result', page).innerHTML = estimateResult(est.result);
  $('#est-run', page).disabled = false;
  if (matchMedia('(max-width: 1099px)').matches) $('#est-result', page).scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  return `<div class="stack-12 rise">
    <div class="card money"><div class="meta">${esc(r.title)}</div><div class="money-value">${rub(r.totalW + r.totalM)}</div>
      <dl class="money-rows"><div class="money-row"><dt>Работы</dt><dd>${rub(r.totalW)}</dd></div><div class="money-row"><dt>Материалы</dt><dd>${rub(r.totalM)}</dd></div></dl>
      <hr><div class="meta">${esc(r.note)}. Предварительный расчёт, специалист проверит его перед отправкой заказчику.</div></div>
    <h3 class="section-title">Работы</h3><ul class="card-list">${r.works.map(row).join('')}</ul>
    <h3 class="section-title">Материалы</h3><ul class="card-list">${r.mats.map(row).join('')}</ul>

function viewCameras(page) {
  page.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Камеры</h1><p class="page-sub">Что происходит на площадках прямо сейчас</p></div></div>
    <div class="cam-grid">${OBJECTS.flatMap((o) => o.cameras.map((c, i) => camTile(o, c, i))).join('')}</div>`;
  page.addEventListener('click', (e) => {
    const c = e.target.closest('[data-cam]'); if (c) { openCamera(c.dataset.cam); return; }
    const ob = e.target.closest('[data-object]'); if (ob) openObject(ob.dataset.object, 'cameras');
  });
}
function openCamera(key) {
  const [oid, i] = key.split(':');
  const o = obj(oid), c = o.cameras[Number(i)];
  Sheet.open((body) => {
    body.innerHTML = `<div class="stack-16">
      ${camTile(o, c, Number(i), true)}
      <div><h2 class="sheet-title">${esc(c.name)}</h2><p class="meta" style="margin:6px 0 0">${esc(o.name)} · ${esc(o.addr)}</p></div>
      ${c.offline ? `<div class="card stack-8" style="border-color:var(--danger)"><b class="t-danger">Камера не в сети с 07:40</b><span class="meta">Скорее всего, на участке отключили электричество. Бригадир получил уведомление.</span></div>`
        : `<section class="section"><h3 class="section-title">Архив за сегодня</h3><div class="chips">${['08:00', '10:00', '12:00', '14:00', '16:00'].map((t) => `<button class="chip" type="button" data-arch="${t}">${t}</button>`).join('')}</div></section>
           <button class="btn" type="button" id="cam-snap">${I('camera')}Сохранить снимок в отчёты</button>`}
    </div>`;
    body.onclick = (e) => {
      const a = e.target.closest('[data-arch]');
      if (a) { $$('[data-arch]', body).forEach((x) => x.setAttribute('aria-pressed', x === a)); toast(`Запись с ${a.dataset.arch}. В демо показан один снимок`); return; }
      if (e.target.closest('#cam-snap')) {
        const s = current(o);
        REPORTS.unshift({ id: 'r' + (++rseq), obj: o.id, stage: s.i, at: new Date(), photos: [c.kind], text: `Снимок с камеры «${c.name}».`, status: 'accepted' });
        toast('Снимок сохранён в отчёты объекта');
      }
    };
  });
}

function viewBrigades(page) {
  page.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Бригады</h1><p class="page-sub">Бригадир отмечает этапы и отправляет фото из своего телефона</p></div></div>
    <ul class="card-grid" style="list-style:none;margin:0;padding:0">${BRIGADES.map((b) => {
      const objs = OBJECTS.filter((o) => o.brigade === b.id);
      const last = REPORTS.filter((r) => objs.some((o) => o.id === r.obj)).sort((a, c) => c.at - a.at)[0];
      return `<li class="card card--tap stack-12" data-brig="${b.id}">
        <div class="row"><span class="avatar avatar--lg">${initials(b.boss)}</span><div class="stack"><span class="name">${esc(b.boss)}</span><span class="meta">Бригадир · ${b.members.length} ${plural(b.members.length, 'человек', 'человека', 'человек')}</span></div></div>
        <dl class="kv"><div><dt>Объекты</dt><dd>${esc(objs.map((o) => o.name).join(', '))}</dd></div>
        <div><dt>Отчёты вовремя</dt><dd class="${b.ontime < 85 ? 't-warn' : ''}">${b.ontime}%</dd></div>
        <div><dt>Последний отчёт</dt><dd>${last ? `${relDay(last.at)}, ${hhmm(last.at)}` : 'нет'}</dd></div></dl>
      </li>`;
    }).join('')}</ul>
    <div class="demo-note">${I('phone')}Бригадиру не нужно ставить приложение: он отправляет фото и отметки через чат РОБОРАБ в мессенджере.</div>`;
  page.addEventListener('click', (e) => { const c = e.target.closest('[data-brig]'); if (c) openBrigade(c.dataset.brig); });
}
function openBrigade(id) {
  Sheet.open((body) => {
    const b = brig(id), objs = OBJECTS.filter((o) => o.brigade === id);
    const rs = REPORTS.filter((r) => objs.some((o) => o.id === r.obj)).sort((a, c) => c.at - a.at).slice(0, 4);
    body.innerHTML = `<div class="stack-16">
      <div class="row"><span class="avatar avatar--lg">${initials(b.boss)}</span><div class="stack"><h2 class="sheet-title">${esc(b.boss)}</h2><span class="meta num">${b.phone}</span></div></div>
      <section class="section"><h3 class="section-title">Состав</h3><ul class="card-list">${b.members.map((m) => `<li class="card line"><span class="avatar" style="width:32px;height:32px;font-size:12px">${initials(m.split(',')[0])}</span><span class="grow">${esc(m)}</span></li>`).join('')}</ul></section>
      <section class="section"><h3 class="section-title">Объекты</h3><ul class="card-list">${objs.map((o) => `<li class="card card--tap" data-object="${o.id}"><div class="between"><span class="stack"><b>${esc(o.name)}</b><span class="meta">Сейчас: ${esc(current(o)?.name || 'сдан')}</span></span><b class="num">${progress(o)}%</b></div></li>`).join('')}</ul></section>
      <section class="section"><h3 class="section-title">Последние отчёты</h3><ul class="card-list">${rs.map((r) => reportCard(r, { actions: true })).join('')}</ul></section>
      <button class="btn-sec" type="button" data-copy="${b.phone}">${I('phone')}Скопировать телефон</button>
    </div>`;
    bindReports(body);
    body.onclick = async (e) => {
      const o = e.target.closest('[data-object]'); if (o) { openObject(o.dataset.object); return; }
      const cp = e.target.closest('[data-copy]');
      if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); toast('Телефон скопирован'); } catch { toast(cp.dataset.copy); } }
    };
  });
}

function updateBadge() {
  const n = REPORTS.filter((r) => r.status === 'review').length;
  const el = $('#bell-badge');
  el.hidden = !n;
  el.textContent = n;
}
function openNotifications() {
  Sheet.open((body) => {
    const late = OBJECTS.flatMap((o) => o.stages.filter(overdue).map((s) => [o, s]));
    const off = OBJECTS.flatMap((o) => o.cameras.filter((c) => c.offline).map((c) => [o, c]));
    body.innerHTML = `<div class="stack-16"><h2 class="sheet-title">Уведомления</h2>
      <ul class="card-list">
        ${late.map(([o, s]) => `<li class="card card--tap" data-object="${o.id}"><div class="row">${I('alert')}<span class="grow"><b>${esc(s.name)}</b> на объекте «${esc(o.name)}» просрочен на ${diffDays(TODAY, s.end)} ${plural(diffDays(TODAY, s.end), 'день', 'дня', 'дней')}</span></div></li>`).join('')}
        ${off.map(([o, c]) => `<li class="card card--tap" data-object="${o.id}"><div class="row">${I('video')}<span class="grow">Камера «${esc(c.name)}» на объекте «${esc(o.name)}» не в сети с 07:40</span></div></li>`).join('')}
      </ul>
      <section class="section"><h3 class="section-title">Ждут проверки</h3><ul class="card-list">${REPORTS.filter((r) => r.status === 'review').map((r) => reportCard(r, { actions: true })).join('') || '<li class="card empty">Всё проверено</li>'}</ul></section></div>`;
    bindReports(body);
    body.onclick = (e) => { const o = e.target.closest('[data-object]'); if (o) openObject(o.dataset.object); };
  });
}

const CHAT_LOG = [{ html: 'Я агент Строй-учёта. Спросите, что с объектом, сколько потрачено, или попросите напомнить бригадиру про отчёт.' }];
function answer(text) {
  const t = text.toLowerCase();
  const o = OBJECTS.find((x) => t.includes(x.name.toLowerCase().split(' ')[0].slice(0, 5)) || t.includes((x.name.split(' ').pop() || '').toLowerCase().replace(/[«»]/g, '').slice(0, 5)));
  if (/потрач|бюджет|затрат|деньг/.test(t)) {
    if (o) return `«${esc(o.name)}»: потрачено ${rub(spent(o))} из ${rub(o.budget)}, это ${Math.round(spent(o) / o.budget * 100)}%. Последняя затрата: ${esc(o.expenses[o.expenses.length - 1].name)}.`;
    return OBJECTS.map((x) => `${esc(x.name)}: ${mln(spent(x))} из ${mln(x.budget)}`).join('<br>');
  }
  if (/срок|просроч|опазд/.test(t)) {
    const late = OBJECTS.flatMap((x) => x.stages.filter(overdue).map((s) => `${esc(x.name)}: ${esc(s.name)}, просрочка ${diffDays(TODAY, s.end)} дн.`));
    return late.length ? `С просрочкой:<br>${late.join('<br>')}` : 'Все этапы идут в срок.';
  }
  if (/напомн|отч[её]т/.test(t)) {
    const x = o || OBJECTS[1];
    return `Написал ${esc(brig(x.brigade).boss)}: «Пришлите фотоотчёт по этапу ${esc(current(x).name)} на объекте ${esc(x.name)} до 18:00». Отчёт появится на главной.`;
  }
  if (o || /как дела|что с|статус/.test(t)) {
    const x = o || OBJECTS[0];
    return `«${esc(x.name)}»: готовность ${progress(x)}%, сейчас идёт этап «${esc(current(x).name)}», бригада ${esc(brig(x.brigade).boss)}. Потрачено ${mln(spent(x))} из ${mln(x.budget)}.`;
  }
  return 'Могу рассказать, что с объектом, сколько потрачено, какие этапы просрочены, и напомнить бригадиру про отчёт. В демо ответы собираются из данных этой страницы.';
}
function openChat() { openAgentChat({ log: CHAT_LOG, quick: ['Что с Малаховкой?', 'Где просрочка?', 'Напомни про отчёт на Ленинском'], answer }); }
