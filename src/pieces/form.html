<form id="lead" action="https://roborabaichat.vercel.app/" method="get">
        <span class="leadico" aria-hidden="true"></span>
        <input type="hidden" name="lang" value="ru">
        <label for="f-name">Имя<input id="f-name" name="name" type="text" autocomplete="name"></label>
        <label for="f-contact">Телефон или e-mail<input id="f-contact" name="contact" type="text" autocomplete="email" required></label>
        <label for="f-prod">Продукт, который вас заинтересовал
          <select id="f-prod" name="product"><option value="Пока не знаю" selected>Пока не знаю</option><option value="Фитнес-CRM">Фитнес-CRM</option><option value="Налоговый агент">Налоговый агент</option><option value="Строй-учёт">Строй-учёт</option><option value="Букинг-CRM">Букинг-CRM</option><option value="SEO / GEO">SEO / GEO</option></select>
        </label>
        <button class="btn" type="submit">Отправить в чат РОБОРАБ AI <span aria-hidden="true">→</span></button>
      </form>
